# The application sends OTLP JSON. Phoenix accepts protobuf; the official collector
# performs the protocol conversion. Neither service receives prompt/response content.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    encoding: proto
    timeout: 2s
    sending_queue:
      queue_size: 32
      num_consumers: 1
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 10s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/phoenix]
