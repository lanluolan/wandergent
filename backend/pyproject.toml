[project]
name = "wandergent-backend"
version = "0.1.0"
description = "Travel-planning Agent backend -- FastAPI + OpenAI SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.54",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run stays offline and fast. `pytest -m mcp` opts into the protocol
# round trip, which spawns a subprocess and reaches Open-Meteo.
addopts = "-m 'not mcp'"
markers = [
    "mcp: exercises the MCP server over a real client session (subprocess + network)",
]

[tool.uv]
package = false
# No `.python-version` pin: `requires-python` above is the only contract, and CI
# proves it by running the matrix (3.11 + 3.13). "never" keeps uv from silently
# downloading a managed interpreter -- it reuses whatever the machine already has,
# or fails loudly if nothing satisfies the range.
python-downloads = "never"
