# Manual only. Every run makes real LLM calls and real Google Maps calls, so this is a
# deliberate spend -- the right gate for prompt, tool and model changes, which is a
# decision a human makes anyway.
name: LLM eval

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "Which cases to run"
        type: choice
        default: smoke
        options: [smoke, all]
      input_usd_per_million:
        description: "Model input USD per 1M tokens (blank means unknown)"
        default: ""
      cached_usd_per_million:
        description: "Model cached-input USD per 1M tokens (blank means unknown)"
        default: ""
      output_usd_per_million:
        description: "Model output USD per 1M tokens (blank means unknown)"
        default: ""
      pricing_source:
        description: "Source for the supplied model rates (optional)"
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked

      - name: Run the eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Without it the maps tools degrade rather than fail, so the run still
          # completes -- it just measures a different agent than production.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          INPUT_RATE: ${{ inputs.input_usd_per_million }}
          CACHED_RATE: ${{ inputs.cached_usd_per_million }}
          OUTPUT_RATE: ${{ inputs.output_usd_per_million }}
          PRICING_SOURCE: ${{ inputs.pricing_source }}
        run: |
          pricing_args=()
          [[ -z "$INPUT_RATE" ]] || pricing_args+=(--input-usd-per-million "$INPUT_RATE")
          [[ -z "$CACHED_RATE" ]] || pricing_args+=(--cached-usd-per-million "$CACHED_RATE")
          [[ -z "$OUTPUT_RATE" ]] || pricing_args+=(--output-usd-per-million "$OUTPUT_RATE")
          [[ -z "$PRICING_SOURCE" ]] || pricing_args+=(--pricing-source "$PRICING_SOURCE")
          uv run python -m evals.run \
            ${{ inputs.subset == 'all' && '--all' || '' }} \
            --today 2026-09-28 \
            "${pricing_args[@]}" \
            --json eval-result.json

      - uses: actions/upload-artifact@v7.0.1
        # The numbers matter most when the job failed, so upload either way.
        if: always()
        with:
          name: eval-result
          path: backend/eval-result.json
          if-no-files-found: warn
